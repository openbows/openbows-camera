<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <!-- 绿色背景 -->
  <rect x="0" y="0" width="24" height="24" rx="4" fill="#2e7d32" />
  
  <!-- 相机主体 -->
  <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 镜头外圈 -->
  <circle cx="12" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 镜头内圈 -->
  <circle cx="12" cy="12" r="2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>